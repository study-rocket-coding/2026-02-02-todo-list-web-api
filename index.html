<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="./assets/favicon.png" />
    <script
      src="https://kit.fontawesome.com/0f3f38a034.js"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="style.css" />
    <title>Login Page | ToDo List</title>
  </head>

  <body>
    <!-- login_page -->
    <div id="loginPage" class="bg-yellow">
      <div class="conatiner loginPage vhContainer">
        <div class="side">
          <a href="#"
            ><img class="logoImg" src="./assets/logoImg.png" alt="logoImg"
          /></a>
          <img class="d-m-n" src="./assets/workImg.png" alt="workImg" />
        </div>
        <div>
          <form class="formControls" action="index.html">
            <h2 class="formControls_txt">最實用的線上代辦事項服務</h2>
            <label class="formControls_label" for="email">Email</label>
            <input
              class="formControls_input"
              type="text"
              id="email"
              name="email"
              placeholder="請輸入 email"
              required
            />
            <span>此欄位不可留空</span>
            <label class="formControls_label" for="password">密碼</label>
            <input
              class="formControls_input"
              type="password"
              name="password"
              id="password"
              placeholder="請輸入密碼"
              required
            />
            <input
              class="formControls_btnSubmit"
              type="button"
              onclick="signIn()"
              value="登入"
            />
            <a class="formControls_btnLink" href="/signUpPage.html">註冊帳號</a>
          </form>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
