<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="./assets/favicon.png" />
    <script
      src="https://kit.fontawesome.com/0f3f38a034.js"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="style.css" />
    <title>Sign Up Page | ToDo List</title>
  </head>

  <body>
    <!-- sign up -->
    <div id="signUpPage" class="bg-yellow">
      <div class="conatiner signUpPage vhContainer">
        <div class="side">
          <a href="#"
            ><img class="logoImg" src="./assets/logoImg.png" alt="logoImg"
          /></a>
          <img class="d-m-n" src="./assets/workImg.png" alt="workImg" />
        </div>
        <div>
          <form class="formControls">
            <h2 class="formControls_txt">註冊帳號</h2>
            <label class="formControls_label" for="email">Email</label>
            <input
              class="formControls_input"
              type="text"
              id="email"
              name="email"
              placeholder="請輸入 email"
              required
            />
            <label class="formControls_label" for="nickname">您的暱稱</label>
            <input
              class="formControls_input"
              type="text"
              name="nickname"
              id="nickname"
              placeholder="請輸入您的暱稱"
            />
            <label class="formControls_label" for="password">密碼</label>
            <input
              class="formControls_input"
              type="password"
              name="password"
              id="password"
              placeholder="請輸入密碼"
              required
            />
            <label class="formControls_label" for="password_2"
              >再次輸入密碼</label
            >
            <input
              class="formControls_input"
              type="password"
              name="password_2"
              id="password_2"
              placeholder="請再次輸入密碼"
              required
            />
            <input
              class="formControls_btnSubmit"
              type="button"
              onclick="signUp()"
              value="註冊帳號"
            />
            <a class="formControls_btnLink" href="/index.html">登入</a>
          </form>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
