<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="./assets/favicon.png" />
    <script
      src="https://kit.fontawesome.com/0f3f38a034.js"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="style.css" />
    <title>ToDo List | ToDo List</title>
  </head>

  <body>
    <!-- ToDo List -->
    <div id="todoListPage" class="bg-half">
      <nav>
        <h1><a href="#">ONLINE TODO LIST</a></h1>
        <ul>
          <li class="todo_sm">
            <a href="#"><span>王小明的代辦</span></a>
          </li>
          <li><a href="/index.html">登出</a></li>
        </ul>
      </nav>
      <div class="conatiner todoListPage vhContainer">
        <div class="todoList_Content">
          <div class="inputBox">
            <input type="text" placeholder="請輸入待辦事項" class="text" />
            <a href="#" class="create_todo">
              <i class="fa fa-plus"></i>
            </a>
          </div>
          <div class="todoList_list">
            <ul class="todoList_tab" id="filterTabs">
              <li><a href="#" class="active" data-status="all">全部</a></li>
              <li><a href="#" data-status="pending">待完成</a></li>
              <li><a href="#" data-status="completed">已完成</a></li>
            </ul>
            <div class="todoList_items">
              <ul class="todoList_item" id="todoList"></ul>
              <div class="todoList_statistics">
                <p><span id="completed-count">0</span> 個已完成項目</p>
                <a href="#">清除已完成項目</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
